<html>
    <head> 
        <title>Form in Html</title>
    </head>
    <body>
        <form>
            <TABLE>
            <tr>
                <th>Title</th>
                <th>Information</th>
                </tr>

                <td> Username:</td>
                <td><input type= "text" name="username" placeholder= "Enter your username"> </td>
            </tr>
            <tr>
                <td> Age: </td>
                <td> <input type = "number" name="age"  value="18">
                    </td>
                    </tr>
                    <tr>
                        <td>hobby:</td>
                        <td><input type="checkbox" name="talking">talking<br>
                        <input type="checkbox" name ="sleeping">sleeping<br></td>
                    </tr>
                    <tr>
                        <td> Gender:</td>
                        <td><input type="radio" name="gender" value="male">Male<br>
                        <input type ="radio" name= "gender" value= "female">Female <br>
                    </td>
                    </tr>
                    <tr>
                        <td> Country:
                            <select>
                                <option value="Gorkha">Gorkha</option>
                                <option value="Kathmandu">Kathmandu</option>
                                <option value= "Other">Other</option>
                            </select>
                        </td>
                    </tr>
                    </TABLE>
                    

                    <br><br>
                    <head>UNORDERD LIST</head>
                    <ul type = "circle">
                        <LI> Apple </LI>
                        <LI> Orange</LI>
                        <LI> Pear</LI>
                    </ul>
                    <br><br>
                    <head>ORDERED LIST</head>
                    <OL TYPE"1" start="s">
                        <LI> HTML</LI>
                        <LI>CSS</LI>
                        <LI>JAVA SCRIPT</LI>
                </OL>
      </body>
</html>
